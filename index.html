<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cálice — Música, censura e resistência</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  body{height:100dvh}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;aspect-ratio:16/9;width:min(100vw,calc(100dvh*16/9));--s:1}
  #stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s;user-select:none;-webkit-user-drag:none}
  #stage>img.on{opacity:1}

  /* ---------- player ---------- */
  #card{
    position:absolute;left:50%;top:72.4%;width:400px;height:156px;
    transform:translateX(-50%) scale(var(--s));transform-origin:top center;
    display:none;flex-direction:column;justify-content:space-between;
    padding:16px 22px 14px;border-radius:20px;
    background:linear-gradient(165deg,#261d11,#090704);
    border:1px solid rgba(217,173,102,.38);
    box-shadow:0 18px 50px rgba(0,0,0,.8),0 0 60px rgba(217,173,102,.10),inset 0 1px 0 rgba(255,235,200,.08);
    font-family:Georgia,'Times New Roman',serif;color:#f3e7d0;
    transition:box-shadow .5s,border-color .5s;
  }
  #card.on{display:flex}
  #card.playing{border-color:rgba(217,173,102,.7);box-shadow:0 18px 50px rgba(0,0,0,.8),0 0 70px rgba(217,173,102,.28),inset 0 1px 0 rgba(255,235,200,.1)}

  .top{display:flex;justify-content:space-between;align-items:center}
  .song{font-size:22px;letter-spacing:.5px;line-height:1.1}
  .artist{font:600 11px/1 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#d9ad66;margin-top:6px}
  .artist.err{color:#e0735f;letter-spacing:.04em;text-transform:none}
  .eq{display:flex;align-items:flex-end;gap:3px;height:22px}
  .eq i{width:4px;height:30%;background:linear-gradient(#f0cd8c,#b8863f);border-radius:2px;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
  .eq i:nth-child(2){animation-delay:-.4s;animation-duration:.8s}
  .eq i:nth-child(3){animation-delay:-.7s;animation-duration:1.15s}
  .eq i:nth-child(4){animation-delay:-.2s;animation-duration:.9s}
  #card.playing .eq i{animation-play-state:running}
  @keyframes eq{0%,100%{height:25%}50%{height:100%}}

  /* barra de progresso */
  #seek{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;outline:none;--p:0%}
  #seek::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,#f0cd8c,#c9954a) 0/var(--p) 100% no-repeat,rgba(255,255,255,.14)}
  #seek::-moz-range-track{height:5px;border-radius:5px;background:rgba(255,255,255,.14)}
  #seek::-moz-range-progress{height:5px;border-radius:5px;background:linear-gradient(90deg,#f0cd8c,#c9954a)}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4.5px;border-radius:50%;background:#fff6e2;box-shadow:0 0 0 4px rgba(217,173,102,.28),0 2px 6px rgba(0,0,0,.6)}
  #seek::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff6e2;box-shadow:0 0 0 4px rgba(217,173,102,.28)}

  .row{display:flex;align-items:center;justify-content:space-between}
  .t{font:500 12px/1 system-ui,sans-serif;color:#b9a98c;font-variant-numeric:tabular-nums;width:46px}
  .t.r{text-align:right}
  .ctl{display:flex;align-items:center;gap:20px}
  .ctl button{border:0;background:none;color:#d9ad66;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,color .15s}
  .ctl button:hover{color:#f0cd8c;transform:scale(1.1)}
  .skip{width:30px;height:30px;font:600 10px/1 system-ui,sans-serif;position:relative}
  .skip svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .skip b{position:absolute;font-weight:700}
  #pPlay{width:52px;height:52px;border-radius:50%;background:linear-gradient(145deg,#f4d79b,#c08a3e);color:#1a1209;box-shadow:0 6px 20px rgba(192,138,62,.45)}
  #pPlay:hover{color:#1a1209;transform:scale(1.07)}
  #pPlay svg{width:22px;height:22px;fill:currentColor}

  /* pop-up de vídeo */
  #pop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(4px)}
  #pop.on{display:flex}
  #pop .box{position:relative;width:100vw;height:100dvh;background:#000}
  #pop video{width:100%;height:100%;object-fit:contain;display:block}
  #x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(217,173,102,.7);background:#1a1209;color:#f3e7d0;font-size:18px;cursor:pointer;z-index:2;box-shadow:0 4px 14px #000}
  #x:hover{background:#c08a3e;color:#1a1209}
  #vmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#e0735f;font:14px system-ui,sans-serif;pointer-events:none}

  /* navegação */
  #nav{position:fixed;bottom:12px;left:12px;z-index:20;display:flex;align-items:center;gap:14px;padding:6px 12px;border-radius:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);transition:opacity .4s}
  #nav.idle{opacity:0;pointer-events:none}
  #nav button{width:48px;height:44px;border:1px solid #555;background:#111;color:#fff;font-size:20px;border-radius:10px;cursor:pointer}
  #nav button:disabled{opacity:.3;cursor:default}
  #count{min-width:64px;text-align:center;font-size:15px;color:#bbb}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <img src="Img/1.jpg" alt="Slide 1"><img src="Img/2.jpg" alt="Slide 2"><img src="Img/3.jpg" alt="Slide 3">
    <img src="Img/4.jpg" alt="Slide 4"><img src="Img/5.jpg" alt="Slide 5"><img src="Img/6.jpg" alt="Slide 6">
    <img src="Img/7.jpg" alt="Slide 7">

    <div id="card">
      <div class="top">
        <div>
          <div class="song">Cálice</div>
          <div class="artist" id="artist">Chico Buarque</div>
        </div>
        <div class="eq"><i></i><i></i><i></i><i></i></div>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" tabindex="-1" aria-label="Progresso da música">
      <div class="row">
        <span class="t" id="tCur">00:00</span>
        <div class="ctl">
          <button class="skip" id="back" aria-label="Voltar 10 segundos">
            <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4.5H8"/></svg><b>10</b>
          </button>
          <button id="pPlay" aria-label="Tocar/Pausar"><svg viewBox="0 0 24 24"><path id="pIcon" d="M7 4.5l13 7.5-13 7.5z"/></svg></button>
          <button class="skip" id="fwd" aria-label="Avançar 10 segundos">
            <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4v4.5H16"/></svg><b>10</b>
          </button>
        </div>
        <span class="t r" id="tDur">00:00</span>
      </div>
    </div>
  </div>
</div>
<div id="nav">
  <button id="prev" aria-label="Anterior">←</button>
  <span id="count"></span>
  <button id="next" aria-label="Próximo">→</button>
  <button id="fs" aria-label="Tela cheia" title="Tela cheia (F)">⛶</button>
</div>
<div id="pop" role="dialog" aria-label="Vídeo">
  <div class="box">
    <button id="x" aria-label="Fechar vídeo">✕</button>
    <video id="vid" src="video.mp4" controls playsinline></video>
    <div id="vmsg">Falta o arquivo video.mp4</div>
  </div>
</div>
<audio id="au" src="musica.mp3" preload="metadata"></audio>

<script>
const $=id=>document.getElementById(id);
const stage=$('stage'), imgs=[...stage.querySelectorAll(':scope>img')], N=imgs.length;
const au=$('au'), card=$('card'), icon=$('pIcon'), seek=$('seek');
let i=0;

/* escala do player acompanha o tamanho da tela (mínimo p/ caber no celular) */
const fit=()=>stage.style.setProperty('--s',Math.max(stage.clientWidth/1440,.62));
addEventListener('resize',fit); fit();

function show(n){
  i=Math.max(0,Math.min(N-1,n));
  imgs.forEach((im,k)=>im.classList.toggle('on',k===i));
  $('count').textContent=(i+1)+' / '+N;
  $('prev').disabled=i===0; $('next').disabled=i===N-1;
  card.classList.toggle('on',i===N-1);
  if(i!==N-1) au.pause();
}
$('prev').onclick=()=>show(i-1);
$('next').onclick=()=>show(i+1);
addEventListener('keydown',e=>{
  if(pop.classList.contains('on')){ if(e.key==='Escape')closePop(); return; }
  if(e.key==='f'||e.key==='F')fs();
  else if(e.key==='ArrowRight')show(i+1);
  else if(e.key==='ArrowLeft')show(i-1);
  else if(e.code==='Space'&&i===N-1){e.preventDefault();toggle();}
});
let x0=null;
addEventListener('touchstart',e=>{ if(!e.target.closest('#card,#pop')) x0=e.touches[0].clientX; },{passive:true});
addEventListener('touchend',e=>{
  if(x0===null)return; const d=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(d)>50)show(i+(d<0?1:-1));
});

/* ---------- player ---------- */
const fmt=s=>{s=Math.floor(s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function draw(){
  const d=au.duration||0, p=d?au.currentTime/d*100:0;
  if(!seeking) seek.value=p*10;
  seek.style.setProperty('--p',p+'%');
  $('tCur').textContent=fmt(au.currentTime); $('tDur').textContent=fmt(d);
}
function toggle(){ au.paused?au.play().catch(()=>{}):au.pause(); }
let seeking=false;
$('pPlay').onclick=e=>{toggle();e.currentTarget.blur()};
$('back').onclick=e=>{au.currentTime=Math.max(0,au.currentTime-10);e.currentTarget.blur()};
$('fwd').onclick=e=>{if(au.duration)au.currentTime=Math.min(au.duration,au.currentTime+10);e.currentTarget.blur()};
seek.addEventListener('input',()=>{seeking=true;seek.style.setProperty('--p',seek.value/10+'%');if(au.duration)au.currentTime=seek.value/1000*au.duration;});
seek.addEventListener('change',()=>{seeking=false;seek.blur();});
au.onplay=()=>{icon.setAttribute('d','M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z');card.classList.add('playing')};
au.onpause=()=>{icon.setAttribute('d','M7 4.5l13 7.5-13 7.5z');card.classList.remove('playing')};
au.ontimeupdate=au.onloadedmetadata=au.ondurationchange=draw;
au.onended=()=>{au.currentTime=0;draw()};
au.onerror=()=>{const a=$('artist');a.textContent='Falta o arquivo musica.mp3';a.classList.add('err')};

/* ---------- vídeo pop-up ---------- */
const POP_AT=23;                       // segundo da música em que o vídeo aparece
const pop=$('pop'), vid=$('vid'); let popped=false, wasPlaying=false;
function openPop(){ wasPlaying=!au.paused; au.pause(); pop.classList.add('on'); vid.currentTime=0; vid.play().catch(()=>{}); }
function closePop(){ vid.pause(); pop.classList.remove('on'); if(wasPlaying)au.play().catch(()=>{}); }
$('x').onclick=closePop;
pop.addEventListener('click',e=>{ if(e.target===pop)closePop(); });
vid.onerror=()=>{$('vmsg').style.display='flex'};
au.addEventListener('timeupdate',()=>{
  const t=au.currentTime;
  if(t>=POP_AT&&t<POP_AT+3&&!popped&&i===N-1){popped=true;openPop();}
  else if(t<POP_AT-1)popped=false;
});

/* tela cheia + esconde os botões quando parado */
const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
$('fs').onclick=e=>{fs();e.currentTarget.blur()};
if(!document.documentElement.requestFullscreen)$('fs').style.display='none';
let idleT; const wake=()=>{$('nav').classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>$('nav').classList.add('idle'),2500)};
['mousemove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,wake)); wake();

show(0);
</script>
</body>
</html>
